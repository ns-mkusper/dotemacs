name: config-ci

on:
  push:
    branches: [main]
    paths:
      - '**/*.el'
      - '**/*.org'
      - '**/*.sh'
      - tests/**
      - .github/workflows/config-ci.yml
  pull_request:
    paths:
      - '**/*.el'
      - '**/*.org'
      - '**/*.sh'
      - tests/**
      - .github/workflows/config-ci.yml
  workflow_dispatch:

concurrency:
  group: config-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-static:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Homebrew downloads
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: ${{ runner.os }}-brew-emacs-v1
          restore-keys: |
            ${{ runner.os }}-brew-emacs-

      - name: Cache Chocolatey packages
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: C:\ProgramData\chocolatey\cache
          key: ${{ runner.os }}-choco-emacs-v2
          restore-keys: |
            ${{ runner.os }}-choco-emacs-

      - name: Configure Chocolatey download cache
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -Path 'C:\ProgramData\chocolatey\cache' -ItemType Directory -Force | Out-Null
          choco config set cacheLocation C:\ProgramData\chocolatey\cache

      - name: Install Emacs (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y emacs-nox

      - name: Install Emacs (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install emacs

      - name: Install Emacs (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install emacs --yes --no-progress

      - name: Run core static battery (Unix)
        if: runner.os != 'Windows'
        run: |
          chmod +x tests/run-battery.sh tests/tangle-config.sh tests/tramp/*.sh
          TEST_SUITE=core-static ./tests/run-battery.sh

      - name: Run core static battery (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          bash -lc "chmod +x tests/run-battery.sh tests/tangle-config.sh tests/tramp/*.sh && TEST_SUITE=core-static ./tests/run-battery.sh"

  emacs-latest-container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run core static, compatibility check and platform smoke in the Emacs 31 container
        run: |
          chmod +x tests/run-emacs-latest-container.sh tests/run-battery.sh tests/tangle-config.sh tests/tramp/*.sh
          RUN_TRAMP_SMOKE=1 ./tests/run-emacs-latest-container.sh
